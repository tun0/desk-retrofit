# Example ESPHome config using the custom desk component.
# Place this next to a `my_components/` folder containing desk/.

esphome:
  name: standing-desk

esp32:
  board: esp32-s3-devkitc-1  # verify against the exact N16R8 variant received
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: my_components
    components: [desk]

wifi: !include wifi.yaml
logger:
api:
ota:
  - platform: esphome

# 20 kHz: above audible, and short compared with the winding's L/R.
output:
  - platform: ledc
    id: motor_pwm
    pin: GPIO42            # PWM, see schematics/gen/sch.py SIGNAL_GPIO
    frequency: 20000Hz

cover:
  - platform: desk
    name: "Standing desk"
    id: desk1
    pwm: motor_pwm
    relay_up:
      number: GPIO39       # DIR_A
      inverted: false      # fixed by this board's own drive polarity, see README §7.3/§6.3
    relay_down:
      number: GPIO40       # DIR_B
      inverted: false
    watchdog_pin: GPIO4    # KICK
    current_pin: 2         # ISENSE, ADC1_CHANNEL_1 on the S3 - ADC2 is unusable with WiFi
    ramp_up_ms: 500
    ramp_down_ms: 300
    settle_ms: 50
    travel_mm: 500
    speed_mm_s: 25.0
    max_run_ms: 25000
    stall_current: 2.2

sensor:
  - platform: template
    name: "Desk current"
    unit_of_measurement: A
    accuracy_decimals: 2
    update_interval: 1s
    lambda: 'return id(desk1).current_amps();'

# The OEM rockers, read as active-low dry contacts.
binary_sensor:
  - platform: gpio
    id: rocker_up
    pin: {number: GPIO9, mode: INPUT_PULLUP, inverted: true}   # SW_UP
    on_press:
      then: [cover.open: desk1]
    on_release:
      then: [cover.stop: desk1]
  - platform: gpio
    id: rocker_down
    pin: {number: GPIO10, mode: INPUT_PULLUP, inverted: true}  # SW_DN
    on_press:
      then: [cover.close: desk1]
    on_release:
      then: [cover.stop: desk1]
